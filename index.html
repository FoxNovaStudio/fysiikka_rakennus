<style>
/* Layout: full-screen 3D view, HUD panels float over it: top bar, tool rail left, action bar bottom. */
:root{--bg:#dfe7ec;--panel:#f3f6f8;--ink:#14232e;--mute:#566a78;--line:#b4c2cc;--accent:#f2b705;--accent-ink:#1b1500;--good:#1f9d57;--bad:#d6402f;--sky1:#9fd0ee;--sky2:#e7f2f7;

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10181e;--panel:#18232b;--ink:#e4edf2;--mute:#8fa3b0;--line:#2b3b46;--sky1:#3a5f86;--sky2:#a9c3d6;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10181e;--panel:#18232b;--ink:#e4edf2;--mute:#8fa3b0;--line:#2b3b46;--sky1:#3a5f86;--sky2:#a9c3d6;color-scheme:dark}

.panel{background:color-mix(in srgb,var(--panel) 93%,transparent);border:1px solid var(--line);border-radius:6px}
#top{left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));display:flex;gap:8px;flex-wrap:wrap;align-items:stretch}

@media (max-width:720px){
 #tools{flex-direction:row;top:auto;bottom:calc(70px + env(safe-area-inset-bottom,0px));left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));width:auto;max-height:none;overflow-x:auto;overflow-y:hidden}

 #cost{min-width:140px}
 .brand{display:none}
}

<script>
/*SIM*/
const G=9.81, DT=1/480, WMAX=20, TQ=1300;
const MAT={
 wood:{name:'Puupalkki',k:22000,maxT:6000,maxC:4500,mass:5,cost:40,color:0xb4854d},
 steel:{name:'Teräspalkki',k:60000,maxT:22000,maxC:16000,mass:11,cost:110,color:0x8196aa},
 rope:{name:'Köysi',k:30000,maxT:14000,maxC:0,mass:1.2,cost:35,color:0x2b2b2b},
 spring:{name:'Jousi',k:7000,maxT:1e12,maxC:1e12,mass:2,cost:70,color:0xf2b705},
 piston:{name:'Mäntä',k:70000,maxT:16000,maxC:16000,mass:9,cost:180,color:0xd8442f},
 rail:{name:'Nosturikisko',k:60000,maxT:22000,maxC:16000,mass:13,cost:140,color:0xe8a317}
};
const MAXLEN={wood:4.5,steel:4.5,rail:4.5,rope:16,spring:4,piston:4};
const WHEEL_COST={1:150,2:260};
function clamp(v,a,b){return v<a?a:v>b?b:v}
function pointInPoly(x,y,P){let c=false;for(let i=0,j=P.length-1;i<P.length;j=i++){const xi=P[i][0],yi=P[i][1],xj=P[j][0],yj=P[j][1];if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))c=!c;}return c}
function designCost(d){let c=0;for(const b of d.beams){const a=d.nodes[b.a],bb=d.nodes[b.b];c+=Math.hypot(a.x-bb.x,a.y-bb.y)*MAT[b.type].cost}for(const n of d.nodes)if(n.wheel)c+=WHEEL_COST[n.wheel];return Math.round(c)}

function collide(c,A,B,rs,e){
 const abx=B.x-A.x,aby=B.y-A.y,l2=abx*abx+aby*aby;
 let t=l2>1e-9?((c.x-A.x)*abx+(c.y-A.y)*aby)/l2:0; t=t<0?0:t>1?1:t;
 const qx=A.x+abx*t,qy=A.y+aby*t,dx=c.x-qx,dy=c.y-qy,R=c.r+rs,d2=dx*dx+dy*dy;
 if(d2>=R*R)return;
 let d=Math.sqrt(d2),nx,ny;
 if(d<1e-6){nx=0;ny=1;d=0}else{nx=dx/d;ny=dy/d}
 const pen=R-d,wA=1-t,wB=t,iC=c.inv,iQ=wA*wA*A.inv+wB*wB*B.inv,tot=iC+iQ;
 if(tot<=0)return;
 const corr=Math.min(pen*0.8,0.004)/tot;
 c.x+=nx*corr*iC;c.y+=ny*corr*iC;
 A.x-=nx*corr*wA*A.inv;A.y-=ny*corr*wA*A.inv;
 if(B!==A){B.x-=nx*corr*wB*B.inv;B.y-=ny*corr*wB*B.inv}
 const vqx=wA*A.vx+wB*B.vx,vqy=wA*A.vy+wB*B.vy;
 let vn=(c.vx-vqx)*nx+(c.vy-vqy)*ny,Jn=0;
 if(vn<0){Jn=-vn*(1+e)/tot;
  c.vx+=nx*Jn*iC;c.vy+=ny*Jn*iC;
  A.vx-=nx*Jn*wA*A.inv;A.vy-=ny*Jn*wA*A.inv;
  if(B!==A){B.vx-=nx*Jn*wB*B.inv;B.vy-=ny*Jn*wB*B.inv}
 }
 const tx=ny,ty=-nx,vq2x=wA*A.vx+wB*B.vx,vq2y=wA*A.vy+wB*B.vy;
 let s=(c.vx-vq2x)*tx+(c.vy-vq2y)*ty,den=tot;
 if(c.rolling){s-=c.r*c.w;den+=c.r*c.r/c.I}
 let Jt=-s/den;const mx=c.mu*Jn;Jt=clamp(Jt,-mx,mx);
 c.vx+=tx*Jt*iC;c.vy+=ty*Jt*iC;
 A.vx-=tx*Jt*wA*A.inv;A.vy-=ty*Jt*wA*A.inv;
 if(B!==A){B.vx-=tx*Jt*wB*B.inv;B.vy-=ty*Jt*wB*B.inv}
 if(c.rolling)c.w-=Jt*c.r/c.I;
}

class Sim{
 constructor(level,design){
  this.level=level;this.t=0;this.input={drive:0,winch:0,trolley:0,piston:0};
  this.bodies=[];this.beams=[];this.loads=[];this.terr=[];this.hook=null;this.hr=null;this.link=null;this.state={};this.bad=false;
  const P=level.terrain;
  for(let i=0;i<P.length;i++){const a=P[i],b=P[(i+1)%P.length];
   this.terr.push({a:{x:a[0],y:a[1],vx:0,vy:0,inv:0},b:{x:b[0],y:b[1],vx:0,vy:0,inv:0},minx:Math.min(a[0],b[0])-0.2,maxx:Math.max(a[0],b[0])+0.2,miny:Math.min(a[1],b[1])-0.2,maxy:Math.max(a[1],b[1])+0.2})}
  design.nodes.forEach((d,i)=>{const wh=d.wheel||0;
   this.bodies.push({id:i,kind:'node',x:d.x,y:d.y,vx:0,vy:0,m:8,inv:0,fixed:!!d.fixed,r:wh?0.55:0.12,mu:wh?1.15:0.5,w:0,ang:0,wheel:wh,rolling:!!wh,I:1,e:0})});
  design.beams.forEach((d,i)=>{const a=this.bodies[d.a],b=this.bodies[d.b],mt=MAT[d.type],L=Math.hypot(a.x-b.x,a.y-b.y);
   const bm={i,a,b,type:d.type,rail:d.type==='rail',k:mt.k,L0:L,Lr:L,maxT:mt.maxT,capC:mt.maxC*Math.min(1,Math.pow(3.2/Math.max(L,0.1),2)),broken:false,F:0,Ff:0,ratio:0,winch:false,c:0};
   if(d.type==='rope'&&(a.fixed||b.fixed))bm.winch=true;
   if(!a.fixed)a.m+=mt.mass*L/2;if(!b.fixed)b.m+=mt.mass*L/2;
   this.beams.push(bm)});
  for(const b of this.bodies){if(b.wheel)b.m+=30;b.inv=b.fixed?0:1/b.m;b.I=0.5*b.m*b.r*b.r}
  for(const m of this.beams){const s=m.a.inv+m.b.inv;m.c=s>0?2*0.25*Math.sqrt(m.k/s):0}
  for(const l of level.loads){const bd={id:'L',kind:l.kind,x:l.x,y:l.y,vx:l.vx||0,vy:0,m:l.m,inv:1/l.m,fixed:false,r:l.r,mu:0.9,w:0,ang:0,wheel:0,rolling:l.kind==='ball',I:0.5*l.m*l.r*l.r,e:0};
   this.bodies.push(bd);this.loads.push(bd)}
  const rails=this.beams.filter(b=>b.rail).sort((p,q)=>(p.a.x+p.b.x)-(q.a.x+q.b.x));
  if(level.crane&&rails.length){const s=0.5;this.rails=rails;const tp=this.trolley(s),tx=tp.x,ty=tp.y;
   this.hook={id:'H',kind:'hook',x:tx,y:ty-3,vx:0,vy:0,m:40,inv:1/40,fixed:false,r:0.3,mu:0.3,w:0,ang:0,wheel:0,rolling:false,I:1,e:0};
   this.bodies.push(this.hook);this.hr={s,Lr:3,k:20000,maxT:16000,broken:false,F:0}}
 }
 trolley(s){const R=this.rails;let tot=0;const ls=R.map(m=>{const l=Math.hypot(m.b.x-m.a.x,m.b.y-m.a.y);tot+=l;return l});
  let arc=s*tot,i=0;while(i<R.length-1&&arc>ls[i]){arc-=ls[i];i++}
  const m=R[i];let A=m.a,B=m.b;if(A.x>B.x){A=m.b;B=m.a}const u=clamp(arc/(ls[i]||1),0,1);
  return{x:A.x+(B.x-A.x)*u,y:A.y+(B.y-A.y)*u,A,B,u,tot,m}}
 hold(key,cond,dt,secs){const s=this.state;s[key]=cond?(s[key]||0)+dt:0;return s[key]>=secs}
 toggleGrab(){
  if(!this.hook)return null;
  if(this.link){const i=this.beams.indexOf(this.link);if(i>=0)this.beams.splice(i,1);this.link=null;return 'release'}
  let best=null,bd=1.8;for(const l of this.loads){const d=Math.hypot(l.x-this.hook.x,l.y-this.hook.y);if(d<bd){bd=d;best=l}}
  if(!best)return 'miss';
  const k=40000,mm=1/(this.hook.inv+best.inv);
  this.link={i:-1,a:this.hook,b:best,type:'link',rail:false,k,L0:Math.max(bd,0.6),Lr:bd,maxT:1e12,capC:1e12,broken:false,F:0,Ff:0,ratio:0,winch:false,c:2*0.3*Math.sqrt(k*mm)};
  this.beams.push(this.link);return 'grab'}
 maxRatio(){let r=0;for(const m of this.beams)if(!m.broken&&m.type!=='link')r=Math.max(r,m.ratio);return r}
 brokenCount(){let n=0;for(const m of this.beams)if(m.broken)n++;return n}
 step(dt){
  const inp=this.input,bs=this.bodies;this.t+=dt;
  for(const b of bs){if(b.fixed)continue;b.vy-=G*dt;const dr=b.kind==='hook'?1.5:(this.link&&this.link.b===b?1.5:0.05);b.vx*=1-dr*dt;b.vy*=1-dr*dt}
  for(const b of bs){if(b.wheel===2&&inp.drive){const d=inp.drive,f=Math.max(0,1-d*b.w/WMAX);b.w+=TQ*d*f/b.I*dt}
   if(b.rolling)b.w*=1-(b.wheel?0.12:0.03)*dt}
  for(const m of this.beams){if(m.broken)continue;
   if(m.winch&&inp.winch)m.L0=clamp(m.L0-inp.winch*1.2*dt,0.6,m.Lr*1.3);
   if(m.type==='piston'){const tgt=m.Lr*(inp.piston?1.8:1);m.L0+=clamp(tgt-m.L0,-2.5*dt,2.5*dt)}
   const dx=m.b.x-m.a.x,dy=m.b.y-m.a.y,L=Math.hypot(dx,dy);if(L<1e-6)continue;
   const nx=dx/L,ny=dy/L,st=L-m.L0;
   if(m.type==='rope'&&st<=0){m.F=0;m.Ff*=0.98;m.ratio=m.Ff/m.maxT;continue}
   const F=m.k*st,rv=(m.b.vx-m.a.vx)*nx+(m.b.vy-m.a.vy)*ny;let Ft=F+m.c*rv;
   if(m.type==='rope'&&Ft<0)Ft=0;
   m.a.vx+=nx*Ft*m.a.inv*dt;m.a.vy+=ny*Ft*m.a.inv*dt;
   m.b.vx-=nx*Ft*m.b.inv*dt;m.b.vy-=ny*Ft*m.b.inv*dt;
   m.F=F;m.Ff+=(F-m.Ff)*0.02;
   m.ratio=m.Ff>=0?m.Ff/m.maxT:-m.Ff/m.capC;
   if(m.type!=='link'&&(m.Ff>m.maxT||-m.Ff>m.capC)){m.broken=true;if(m===this.link)this.link=null}
  }
  const h=this.hr;
  if(h&&!h.broken){
   let tp=this.trolley(h.s);
   if(inp.trolley){h.s=clamp(h.s+inp.trolley*3/tp.tot*dt,0.02,0.98);tp=this.trolley(h.s)}
   if(inp.winch)h.Lr=clamp(h.Lr-inp.winch*1.6*dt,1.2,30);
   if(tp.m.broken){h.broken=true}else{
    const A=tp.A,B=tp.B,u=tp.u,hk=this.hook,dx=hk.x-tp.x,dy=hk.y-tp.y,L=Math.hypot(dx,dy);

 if(key!==sig){sig=key;rebuildStruct(nodes,design.beams)}

  const tp=s.trolley(s.hr.s);trolleyM.position.set(tp.x,tp.y,0);hookGroup.position.set(s.hook.x,s.hook.y,0);
  const lineTo=(m,ax,ay,bx,by,show)=>{m.visible=show;const dx=bx-ax,dy=by-ay,L=Math.hypot(dx,dy);m.position.set((ax+bx)/2,(ay+by)/2,0);m.rotation.z=Math.atan2(dy,dx);m.scale.x=Math.max(L,0.01)};

/* ---------- design editing ---------- */
function newDesign(){return{nodes:level.anchors.map(a=>({x:a[0],y:a[1],fixed:true})),beams:[]}}
function clone(d){return JSON.parse(JSON.stringify(d))}
function pushHist(){S.hist.push(clone(design));if(S.hist.length>60)S.hist.shift()}
function undo(){if(S.mode!=='build'||!S.hist.length)return;design=S.hist.pop();S.designs[S.li]=design;S.start=null;refreshHUD()}
function removeNodes(set){const map=[];let k=0;design.nodes.forEach((n,i)=>{if(set.has(i))map.push(-1);else map.push(k++)});
 design.nodes=design.nodes.filter((n,i)=>!set.has(i));design.beams=design.beams.filter(b=>map[b.a]>=0&&map[b.b]>=0).map(b=>({...b,a:map[b.a],b:map[b.b]}))}
function cleanup(){const used=new Set();design.beams.forEach(b=>{used.add(b.a);used.add(b.b)});const rm=new Set();design.nodes.forEach((n,i)=>{if(!n.fixed&&!n.wheel&&!used.has(i))rm.add(i)});if(rm.size)removeNodes(rm)}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2200)}
function canPlace(x,y){const r=level.region;if(x<r.x0-1e-6||x>r.x1+1e-6||y<r.y0-1e-6||y>r.y1+1e-6)return false;return !pointInPoly(x,y+0.04,level.terrain)}
function nodeAt(x,y,rad){let bi=-1,bd=rad;design.nodes.forEach((n,i)=>{const d=Math.hypot(n.x-x,n.y-y);if(d<bd){bd=d;bi=i}});return bi}
function segDist(px,py,a,b){const dx=b.x-a.x,dy=b.y-a.y,l2=dx*dx+dy*dy;let t=l2?((px-a.x)*dx+(py-a.y)*dy)/l2:0;t=Math.max(0,Math.min(1,t));return Math.hypot(px-(a.x+dx*t),py-(a.y+dy*t))}
const snap=v=>Math.round(v*2)/2;
const SPLIT=['wood','steel','rail'];
const isBeamTool=t=>MAT[t]!==undefined;

function clickBuild(p){
 const tool=S.tool;
 if(tool==='erase'){const ni=nodeAt(p.x,p.y,0.5);
  if(ni>=0&&!design.nodes[ni].fixed){pushHist();removeNodes(new Set([ni]));cleanup();refreshHUD();return}
  let bi=-1,bd=0.35;design.beams.forEach((b,i)=>{const d=segDist(p.x,p.y,design.nodes[b.a],design.nodes[b.b]);if(d<bd){bd=d;bi=i}});
  if(bi>=0){pushHist();design.beams.splice(bi,1);cleanup();refreshHUD()}return}
 if(tool==='wheelM'||tool==='wheelF'){const w=tool==='wheelM'?2:1;let ni=nodeAt(p.x,p.y,0.5);
  if(ni>=0){if(design.nodes[ni].fixed){toast('Kiinteää pistettä ei voi muuttaa pyöräksi');return}pushHist();design.nodes[ni].wheel=w}
  else{const x=snap(p.x),y=snap(p.y);if(!canPlace(x,y)){toast('Tähän ei voi rakentaa');return}pushHist();design.nodes.push({x,y,wheel:w})}
  refreshHUD();return}
 // beam tools
 let ni=nodeAt(p.x,p.y,0.5);
 if(S.start===null){
  if(ni<0){const x=snap(p.x),y=snap(p.y);if(!canPlace(x,y)){toast('Tähän ei voi rakentaa');return}pushHist();design.nodes.push({x,y,wheel:0});ni=design.nodes.length-1}
  S.start=ni;return}
 if(ni===S.start){S.start=null;cleanup();return}
 const A=design.nodes[S.start];
 let x,y;if(ni>=0){x=design.nodes[ni].x;y=design.nodes[ni].y}else{x=snap(p.x);y=snap(p.y);if(!canPlace(x,y)){toast('Tähän ei voi rakentaa');return}}
 const L=Math.hypot(x-A.x,y-A.y);
 const split=SPLIT.includes(tool),maxTotal=split?32:MAXLEN[tool];
 if(L>maxTotal+1e-6){toast('Liian pitkä: enintään '+maxTotal+' m');return}
 if(L<0.4){return}
 if(ni>=0&&design.beams.some(b=>(b.a===S.start&&b.b===ni)||(b.b===S.start&&b.a===ni))){toast('Palkki on jo olemassa');return}
 const n=split?Math.max(1,Math.ceil(L/MAXLEN[tool]-1e-9)):1;
 if(n>1&&L/n<0.4)return;
 // intermediate points, reuse nearby existing nodes
 const pts=[];
 for(let i=1;i<n;i++){const px=A.x+(x-A.x)*i/n,py=A.y+(y-A.y)*i/n;const ex=nodeAt(px,py,0.3);
  if(ex>=0&&ex!==S.start&&ex!==ni){pts.push({idx:ex})}else{if(!canPlace(px,py)){toast('Palkki osuu maastoon');return}pts.push({x:px,y:py})}}
 pushHist();
 const chain=[S.start];
 for(const p of pts){if(p.idx!==undefined)chain.push(p.idx);else{design.nodes.push({x:p.x,y:p.y,wheel:0});chain.push(design.nodes.length-1)}}
 if(ni<0){design.nodes.push({x,y,wheel:0});ni=design.nodes.length-1}
 chain.push(ni);
 for(let i=0;i<chain.length-1;i++){const p=chain[i],q=chain[i+1];
  if(p!==q&&!design.beams.some(b=>(b.a===p&&b.b===q)||(b.a===q&&b.b===p)))design.beams.push({a:p,b:q,type:tool})}
 S.start=null;cleanup();refreshHUD()}

 if(!S.tool||!level.tools.includes(S.tool))S.tool=level.tools[0];

 $('gt').textContent=level.title;$('gs').textContent=level.goal;$('banner').hidden=true;$('win').hidden=true;$('readout').hidden=true;grid.visible=true;
 $('ik').textContent='Haaste '+(i+1)+' / '+LEVELS.length;$('it').textContent=level.title;$('ib').textContent=level.brief;$('ih').textContent=level.hint;$('intro').hidden=false;

function startTest(again){

 if(c>level.budget){toast('Budjetti ylittyy');return}
 if(design.beams.length===0){toast('Rakenna ensin jotain');return}
 if(level.crane&&design.beams.some(b=>b.type==='rail')===false&&S.li===2){toast('Tarvitset nosturikiskon (työkalu Nosturikisko)');return}
 if(S.li===3&&!design.nodes.some(n=>n.wheel===2)){toast('Tarvitset ainakin yhden moottoripyörän');return}
 S.mode='test';S.start=null;S.sim=new Sim(level,clone(design));S.done=false;S.acc=0;$('banner').hidden=true;$('win').hidden=true;

 if(r.win){const c=designCost(design),ratio=c/level.budget;const st=ratio<=level.stars[1]?3:ratio<=level.stars[0]?2:1;
  S.progress[S.li]=Math.max(S.progress[S.li]||0,st);try{localStorage.setItem('engineer-fi',JSON.stringify(S.progress))}catch(e){}buildTabs();
  $('wt').textContent=level.title+' valmis';$('ws').textContent='★'.repeat(st)+'☆'.repeat(3-st);
  $('wp').textContent='Kustannus '+c.toLocaleString('fi-FI')+' € (budjetti '+level.budget.toLocaleString('fi-FI')+' €). '+(st<3?'Tähtiä saa lisää edullisemmalla rakenteella: kaksi tähteä alle '+Math.round(level.stars[0]*100)+' %, kolme alle '+Math.round(level.stars[1]*100)+' % budjetista.':'Erinomainen, kevyt ja edullinen rakenne!');

    $('readout').hidden=false;const segs=sp?Math.max(1,Math.ceil(L/MAXLEN[S.tool]-1e-9)):1;$('readout').textContent='Pituus '+L.toFixed(1)+' m'+(segs>1?' ('+segs+' palkkia)':'')+'  ·  '+Math.round(L*MAT[S.tool].cost)+' €'}}
  if(S.start!==null){const A=design.nodes[S.start];if(A){ghost.visible=true}}
 }
